<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<meta name="HandheldFriendly" content="true" />
		<style>
			#panel { position: absolute; left: 0px; right: 0px; bottom: 0px; padding: 8px; background: rgba(0, 0, 0, 0.5); color: #FFFFFF; font-family: monospace; font-size: 12px; }
			#panel button { font-size: 14px; padding: 8px; margin: 2px; }
			#panel input { font-size: 14px; width: 45%; }
			#status { white-space: pre; margin-bottom: 4px; }
		</style>
	  </head>
	<body>
		<button id="start" style="display: block; position: absolute; background-color: #FF6666; width: 100%; height: 100%; top: 0px; left: 0px; text-align: center; font-family: Arial, Helvetica, sans-serif; font-size: 10vh">
			Start AR
		</button>
		<div id="panel">
			<div id="status"></div>
			<input id="label" type="text" value="P0-test-r1" />
			<button id="record">Start</button>
			<button id="download">Download</button><br />
			<button id="floor">Mark floor</button>
			<button id="lamp">Mark lamp</button>
			<button id="moved">Lamp moved</button>
		</div>
        <script async src="./lib/es-module-shims.js"></script>
        <script type="importmap">
			{
				"imports": {
					"three": "./lib/three.module.js"
				}
			}
		</script>
        <script type="module">
            import {Mesh, MeshPhysicalMaterial, SphereGeometry, AmbientLight, Vector3} from "three";
            import {ARRenderer, Cursor, LightProbe, LightLogger, FloorPlane} from "../src/enva.ts";

            (async function () {
                const renderer = new ARRenderer({
                    domOverlay: true,
                    hitTest: true,
                    lightProbe: true
                });

                renderer.scene.add(new AmbientLight(0x333333));

                let lightProbe = new LightProbe();
                renderer.scene.add(lightProbe);

                let logger = new LightLogger();
                renderer.scene.add(logger);

                let cursor = new Cursor();
                renderer.scene.add(cursor);

                let floor = new FloorPlane();
                renderer.scene.add(floor);

                renderer.domContainer.ondblclick = function(event) {
                    if (cursor.visible) {
                        let material = new MeshPhysicalMaterial({color: (Math.random() * 0xFFFFFF)});

                        let sphere = new Mesh(new SphereGeometry(), material);
                        sphere.receiveShadow = true;
                        sphere.castShadow = true;
                        sphere.scale.setScalar(0.1);
                        sphere.position.copy(cursor.position);
                        sphere.position.y += sphere.scale.y / 2.0;
                        renderer.scene.add(sphere);
                    }
                };

                // Logger panel, shown over the camera view
                const panel = document.getElementById("panel");
                const status = document.getElementById("status");
                const label = document.getElementById("label");
                const record = document.getElementById("record");
                let message = "";

                renderer.domContainer.appendChild(panel);

                // Taps on the panel must not place spheres or trigger XR select events
                panel.addEventListener("dblclick", (e) => e.stopPropagation());
                panel.addEventListener("beforexrselect", (e) => e.preventDefault());

                label.onchange = () => { logger.label = label.value; };
                logger.label = label.value;

                record.onclick = () => {
                    if (logger.recording) {
                        logger.stop();
                        record.textContent = "Start";
                    } else {
                        logger.label = label.value;
                        logger.start();
                        record.textContent = "Stop";
                    }
                };

                document.getElementById("download").onclick = () => { logger.download(); };

                document.getElementById("floor").onclick = () => {
                    if (cursor.visible) {
                        logger.markFloor(cursor.position);
                        message = "floor marked";
                    } else {
                        message = "no floor under cursor";
                    }
                };

                document.getElementById("lamp").onclick = () => {
                    message = logger.markLamp(renderer) ? "lamp mark " + logger.lamps.length : "no viewer pose";
                };

                document.getElementById("moved").onclick = () => {
                    logger.mark("lamp-moved");
                    message = "marker " + logger.markers.length;
                };

                const f = (v) => v ? v.map((x) => x.toFixed(3)).join(", ") : "-";

                // Refresh the status text a few times per second, not every frame
                renderer.onFrame = () => {
                    if (logger.frameCount % 10 !== 0) {
                        return;
                    }

                    const world = logger.latestWorldDirection;
                    const truth = logger.trueDirection();
                    const lamp = logger.lampPosition();
                    const spread = lamp ? Math.max(...logger.lamps.map((l) => lamp.distanceTo(new Vector3().fromArray(l)))) : null;
                    const angle = world && truth ? (world.angleTo(truth) * 180 / Math.PI).toFixed(1) + " deg" : "-";

                    status.textContent =
                        "frames " + logger.frameCount + "  rows " + logger.rowCount + (logger.recording ? "  REC" : "") + (logger.saved ? "" : "  unsaved") + "\n" +
                        "dir    " + f(logger.latestDirection) + "  updates " + logger.updates + "\n" +
                        "world  " + f(world ? world.toArray() : null) + "\n" +
                        "viewer " + f(logger.latestViewerPosition) + (logger.latestEmulated ? "  EMULATED" : "") + "\n" +
                        "changed " + (logger.latestChanged ? 1 : 0) + "  fallback " + (logger.latestFallback ? 1 : 0) + "\n" +
                        "floor " + (logger.floor ? "ok" : "-") + "  lamps " + logger.lamps.length + (spread !== null ? " (spread " + (spread * 100).toFixed(1) + " cm)" : "") + "\n" +
                        "true  " + f(truth ? truth.toArray() : null) + "  error " + angle + "\n" +
                        message;
                };

                var button = document.getElementById("start");
                button.onclick = () =>
                {
                    renderer.start();
                };
            })();
        </script>
	</body>
</html>
